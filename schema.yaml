components:
  schemas:
    GenderEnum:
      enum:
      - pria
      - wanita
      type: string
      description: |-
        * `pria` - Pria
        * `wanita` - Wanita
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginError400:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        user_role:
          type: array
          items:
            type: string
        user_id:
          type: integer
        username:
          type: string
      required:
      - message
      - user_id
      - user_role
      - username
    PatchedStudent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fullname:
          type: string
          maxLength: 255
        nik:
          type: string
          maxLength: 30
        nis:
          type: string
          maxLength: 10
        nisn:
          type: string
          maxLength: 16
        gender:
          $ref: '#/components/schemas/GenderEnum'
        status:
          $ref: '#/components/schemas/Status854Enum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedStudentProfile:
      type: object
      properties:
        student:
          allOf:
          - $ref: '#/components/schemas/StudentOutput'
          readOnly: true
        student_id:
          type: integer
          writeOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 14
        birth_date:
          type: string
          format: date
        birth_place:
          type: string
          maxLength: 20
        address:
          type: string
    PatchedTeacher:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fullname:
          type: string
          maxLength: 255
        nik:
          type: string
          maxLength: 30
        status:
          $ref: '#/components/schemas/TeacherStatusEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTeacherProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        teacher:
          allOf:
          - $ref: '#/components/schemas/TeacherOutput'
          readOnly: true
        teacher_id:
          type: integer
          writeOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 13
        address:
          type: string
    Register:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
      - username
    RegisterError400:
      type: object
      properties:
        username:
          type: array
          items:
            type: string
        email:
          type: array
          items:
            type: string
        password:
          type: array
          items:
            type: string
    RegisterSuccess201:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Status854Enum:
      enum:
      - active
      - transfer
      - drop out
      - no have class
      type: string
      description: |-
        * `active` - Active
        * `transfer` - Transfer
        * `drop out` - Drop Out
        * `no have class` - No Have Class
    Student:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fullname:
          type: string
          maxLength: 255
        nik:
          type: string
          maxLength: 30
        nis:
          type: string
          maxLength: 10
        nisn:
          type: string
          maxLength: 16
        gender:
          $ref: '#/components/schemas/GenderEnum'
        status:
          $ref: '#/components/schemas/Status854Enum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - fullname
      - gender
      - id
      - nik
      - nisn
      - status
      - updated_at
    StudentOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fullname:
          type: string
          maxLength: 255
        nis:
          type: string
          maxLength: 10
        nisn:
          type: string
          maxLength: 16
        gender:
          $ref: '#/components/schemas/GenderEnum'
        status:
          $ref: '#/components/schemas/Status854Enum'
        is_active:
          type: boolean
      required:
      - fullname
      - gender
      - id
      - nisn
      - status
    StudentProfile:
      type: object
      properties:
        student:
          allOf:
          - $ref: '#/components/schemas/StudentOutput'
          readOnly: true
        student_id:
          type: integer
          writeOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 14
        birth_date:
          type: string
          format: date
        birth_place:
          type: string
          maxLength: 20
        address:
          type: string
      required:
      - address
      - birth_date
      - birth_place
      - email
      - phone
      - student
      - student_id
    Teacher:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fullname:
          type: string
          maxLength: 255
        nik:
          type: string
          maxLength: 30
        status:
          $ref: '#/components/schemas/TeacherStatusEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
