openapi: 3.0.3
info:
  title: SMK Kharya Bhakti API
  version: 1.0.0
  description: API untuk Management Sekolah
paths:
  /auth/school/api/login/:
    post:
      operationId: auth_school_api_login_create
      description: Login dengan username & password untuk mendapatkan session. Role
        diambil dari groups Django.
      summary: Login User
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              ContohRequestLogin:
                value:
                  username: admin
                  password: admin123
                summary: Contoh Request Login
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                ContohResponseSukses:
                  value:
                    message: Berhasil Login
                    user_role:
                    - admin
                    - staff
                    user_id: 1
                    username: admin
                  summary: Contoh Response Sukses
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError400'
              examples:
                Error-PasswordSalah:
                  value:
                    detail: Username atau password salah
                  summary: Error - Password Salah
                Error-AkunBelumVerifkasiOTP:
                  value:
                    detail: Informasi Akun Tidak Di Temukan
                  summary: Error - Akun Belum Verifkasi OTP
          description: ''
  /auth/school/api/register/:
    post:
      operationId: auth_school_api_register_create
      description: Membuat akun baru dengan validasi username, email unik dan password
        minimal 8 karakter.
      summary: Register Akun Baru
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              RequestValid:
                value:
                  username: johndoe
                  email: john@mail.com
                  password: password12345
                summary: Request Valid
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccess201'
              examples:
                ResponseSukses:
                  value:
                    message: Akun Berhasil Di Buat
                  summary: Response Sukses
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterError400'
              examples:
                Error-UsernameSudahAda:
                  value:
                    username:
                    - Username Tidak Tersedia
                  summary: Error - Username sudah ada
                Error-EmailSudahAda:
                  value:
                    email:
                    - Email Tidak Tersedia
                  summary: Error - Email sudah ada
                Error-PasswordPendek:
                  value:
                    password:
                    - Minimal Password 8 Character
                  summary: Error - Password pendek
          description: ''
